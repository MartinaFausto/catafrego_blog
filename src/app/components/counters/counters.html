<div
    #statsSection
    class="grid grid-cols-2 lg:grid-cols-4 gap-6">


    @for (stat of stats; track stat.label) {

        <p-card>

            <div class="flex flex-col items-center py-4">

                <i class="pi {{ stat.icon }} text-4xl mb-3"></i>


                <span
                    #counter
                    class="text-5xl font-bold">
                    0
                </span>


                <span class="mt-2">
                    {{ stat.label | translate }}
                </span>


            </div>

        </p-card>

    }


</div>
