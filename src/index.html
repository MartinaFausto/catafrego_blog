<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Catalina Fregonese</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="assets/imgs/avatar.png">
  <link rel="preload" as="image" href="assets/imgs/copertina.jpg">
  <script>
    // Blocca il pinch-to-zoom nativo di Safari
    document.addEventListener('touchmove', function (event) {
      if (event.scale !== 1 && event.scale !== undefined) {
        event.preventDefault();
      }
    }, { passive: false });

    // Blocca il doppio tap (double-tap-to-zoom)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
